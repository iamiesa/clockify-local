# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: timetrack            # Public URL becomes https://timetrack.onrender.com (or with a suffix if taken)
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: TimeTrack
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true    # random 32-byte key; config/app.php accepts this format
      - key: APP_URL
        sync: false            # set to your Render URL, e.g. https://timetrack.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false            # Neon connection string (postgresql://...?sslmode=require)
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_LEVEL
        value: warning
      - key: PORT
        value: "8080"
